name: Release

on:
  push:
    branches: [main]
    paths:
      - Resources/Info.plist
  workflow_dispatch:

concurrency:
  group: concerta-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      create_release: ${{ steps.release.outputs.create_release }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read and validate app version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import plistlib; print(plistlib.load(open("Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a MAJOR.MINOR.PATCH app version, got: $version" >&2
            exit 1
          fi

          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "create_release=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; nothing to publish."
          else
            echo "create_release=true" >> "$GITHUB_OUTPUT"
            echo "Preparing release $tag."
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.create_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate app version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          app_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [[ "$VERSION" != "$app_version" ]]; then
            echo "Workflow version $VERSION does not match app version $app_version" >&2
            exit 1
          fi

      - name: Build and package app
        run: ./scripts/build.sh

      - name: Create release archive
        env:
          ARCH: ${{ matrix.arch }}
        run: ditto -c -k --sequesterRsrc --keepParent build/Concerta.app "Concerta-${ARCH}.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: Concerta-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Concerta $RELEASE_TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"
